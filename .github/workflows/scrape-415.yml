name: Update 415 lb stats

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: production

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/scrape-415.js

      - name: Push updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add static/stats-415.json static/ranks-415.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "update stats and ranks for 415"

          # another map's scrape may have landed since checkout, so rebase onto it before pushing
          git pull --rebase origin production
          git push
