name: Update server car lists

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-cars:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: production

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/scrape-cars.js

      - name: Push updated car lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add static/cars.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "update server car lists"

          # another scrape may have landed since checkout, so rebase onto it before pushing
          git pull --rebase origin production
          git push
